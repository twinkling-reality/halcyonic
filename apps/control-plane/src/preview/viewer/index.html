<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Play</title>
<link rel="icon" href="/icon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="/icon-64.png" sizes="64x64" type="image/png">
<link rel="stylesheet" href="/viewer.css">
<script src="/viewer.js" defer></script>
</head>
<body>
<header>
  <h1>Play</h1>
  <p id="status" class="status">Connecting</p>
  <p id="sound" class="sound" hidden></p>
</header>
<main>
  <div id="stage" class="stage">
    <img id="screen" alt="Game" draggable="false">
    <button id="start" type="button">Click to Play</button>
    <div id="ended" class="ended" hidden>
      <p id="ended-title" class="ended-title"></p>
      <p id="ended-why" class="ended-why" hidden></p>
      <p class="ended-next">Start it again from the headset.</p>
    </div>
  </div>
</main>
</body>
</html>
