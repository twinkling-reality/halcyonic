<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Play</title>
<link rel="stylesheet" href="/viewer.css">
<script src="/viewer.js" defer></script>
</head>
<body>
<header>
  <h1>Play</h1>
  <p id="status" class="status">Connecting</p>
  <p id="sound" class="sound" hidden></p>
</header>
<main>
  <div id="stage" class="stage">
    <img id="screen" alt="Game" draggable="false">
    <button id="start" type="button">Click to Play</button>
    <p id="ended" class="ended" hidden></p>
  </div>
</main>
</body>
</html>
